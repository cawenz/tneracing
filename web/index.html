<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFID Race Timer - Live Results</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h2 class="live-results">Live Results</h2>
            </div>
            
            <div id="race-name" class="race-name">No Race Name Set</div>
            <div id="race-timer" class="race-timer">0:00:00</div>
            
            <div class="header-bottom">
                <div class="race-status">
                    <div id="status-indicator" class="status-indicator"></div>
                    <div id="race-status">Waiting for race to start</div>
                </div>
                <div id="race-mode" class="race-mode">Race Mode: Not Set</div>
            </div>
        </header>
        
        <div class="tabs">
            <button class="tab-button active" data-tab="standings">Current Standings</button>
            <button class="tab-button" data-tab="lap-times">Lap Times</button>
        </div>
        
        <main>
            <div id="standings" class="tab-content active">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Status</th>
                            <th>Position</th>
                            <th>Racer</th>
                            <th>Laps</th>
                            <th>Gap</th>
                            <th>Best Lap</th>
                            <th>Last Lap</th>
                            <th>Total Time</th>
                        </tr>
                    </thead>
                    <tbody id="standings-body">
                        <tr>
                            <td colspan="8">Waiting for race data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="lap-times" class="tab-content">
                <h2>Lap Times</h2>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Racer Name</th>
                            <th>Lap Number</th>
                            <th>Lap Time</th>
                            <th>Total Time</th>
                        </tr>
                    </thead>
                    <tbody id="lap-times-body">
                        <!-- Lap time rows will be populated by script.js -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
